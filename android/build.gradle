apply plugin: 'com.android.library'

android {
  namespace 'com.finstao.douyin'
  compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  defaultConfig { minSdkVersion 24; consumerProguardFiles 'consumer-rules.pro' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
repositories { mavenCentral(); google(); maven { url 'https://artifact.bytedance.com/repository/AwemeOpenSDK' } }
dependencies {
  implementation 'com.facebook.react:react-android:+'
  implementation 'androidx.core:core:1.13.1'
  implementation 'com.bytedance.ies.ugc.aweme:opensdk-china-external:0.2.0.10'
  implementation 'com.bytedance.ies.ugc.aweme:opensdk-common:0.2.0.10'
  implementation 'com.bytedance.ies.ugc.aweme:openokhttp-china-external:0.2.0.10'
  implementation 'com.bytedance.ies.ugc.aweme:openpicasso-china-external:0.2.0.10'
}
